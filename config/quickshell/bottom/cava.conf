# Read by services/Media.qml: 72 ascii bars (0-100) on stdout, one frame per line.
# autosens (on by default) levels each song; monstercat smooths neighbouring bars.
# MediaCard's scope uses all 72; MediaIsland samples 24 of them.
[general]
bars = 72
framerate = 30
[input]
method = pipewire
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
[smoothing]
monstercat = 1
noise_reduction = 50
